<h2 mat-dialog-title>Add New Tab</h2>
<div mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field appearance="fill">
      <mat-label>Tab Title</mat-label>
      <input matInput formControlName="title">
      <mat-error *ngIf="form.get('title')?.hasError('required')">Title is required</mat-error>
      <mat-error *ngIf="form.get('title')?.hasError('maxlength')">Title cannot exceed 50 characters</mat-error>
      <mat-error *ngIf="form.get('title')?.hasError('titleExists')">Tab with this title already exists</mat-error>
    </mat-form-field>
  </form>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-button color="primary" (click)="onSave()" [disabled]="form.invalid">Add Tab</button>
</div>

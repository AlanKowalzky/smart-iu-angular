<h2 mat-dialog-title>Add New Dashboard</h2>
<mat-dialog-content [formGroup]="addDashboardForm">
  <mat-form-field appearance="fill">
    <mat-label>ID</mat-label>
    <input matInput formControlName="id" required>
    <mat-error *ngIf="addDashboardForm.controls['id'].hasError('required')">
      ID is required.
    </mat-error>
    <mat-error *ngIf="addDashboardForm.controls['id'].hasError('maxlength')">
      ID cannot exceed 30 characters.
    </mat-error>
    <mat-error *ngIf="addDashboardForm.controls['id'].hasError('uniqueId')">
      ID must be unique.
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Title</mat-label>
    <input matInput formControlName="title" required>
    <mat-error *ngIf="addDashboardForm.controls['title'].hasError('required')">
      Title is required.
    </mat-error>
    <mat-error *ngIf="addDashboardForm.controls['title'].hasError('maxlength')">
      Title cannot exceed 50 characters.
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Icon</mat-label>
    <input matInput formControlName="icon" required>
    <mat-error *ngIf="addDashboardForm.controls['icon'].hasError('required')">
      Icon is required.
    </mat-error>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-button color="primary" (click)="onSubmit()" [disabled]="addDashboardForm.invalid">Add</button>
</mat-dialog-actions>
